name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: build and test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: packages/colony-core/pnpm-lock.yaml
      - name: Install
        working-directory: packages/colony-core
        run: pnpm install --frozen-lockfile
      - name: Build (strict TypeScript)
        working-directory: packages/colony-core
        run: pnpm build
      - name: Lint
        working-directory: packages/colony-core
        run: pnpm lint
      - name: Test
        working-directory: packages/colony-core
        run: pnpm test
